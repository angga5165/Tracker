<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="app-container">
    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <!-- Logo Banner -->
      <div class="logo-container">
        <div class="logo-icon">
          <i data-lucide="wallet"></i>
        </div>
        <span class="logo-text">ExpenseTracker</span>
      </div>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="nav-menu">
        <div class="nav-item active" data-tab="dashboard">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          <span class="nav-text">Dashboard</span>
        </div>
        <div class="nav-item" data-tab="input">
          <i data-lucide="plus-circle" class="nav-icon"></i>
          <span class="nav-text">Input Harian</span>
        </div>
        <div class="nav-item" data-tab="rekap">
          <i data-lucide="calendar-days" class="nav-icon"></i>
          <span class="nav-text">Rekap Harian</span>
        </div>
        <div class="nav-item" data-tab="analisis">
          <i data-lucide="pie-chart" class="nav-icon"></i>
          <span class="nav-text">Analisis Kategori</span>
        </div>
        <div class="nav-item" data-tab="visualisasi">
          <i data-lucide="bar-chart-3" class="nav-icon"></i>
          <span class="nav-text">Visualisasi</span>
        </div>
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-bottom">
        <div class="nav-item" data-tab="pengaturan" id="nav-settings">
          <i data-lucide="settings" class="nav-icon"></i>
          <span class="nav-text">Pengaturan</span>
        </div>
        <!-- Collapse Sidebar Trigger -->
        <button class="nav-item" id="sidebar-collapse-btn" style="background: none; border: none; width: 100%; text-align: left;">
          <i data-lucide="chevron-left" class="nav-icon" id="collapse-icon"></i>
          <span class="nav-text">Collapse</span>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Wrapper -->
    <div class="main-wrapper">
      <!-- Sticky Top Header -->
      <header class="top-header" id="top-header">
        <div class="header-left">
          <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle mobile menu">
            <i data-lucide="menu"></i>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="header-right">
          <span class="month-display">Mei 2026</span>
          <!-- Theme Switcher -->
          <button class="theme-toggle" id="theme-toggle-btn" title="Toggle Light/Dark Mode">
            <i data-lucide="sun" id="theme-icon"></i>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="content-body">
        <div class="max-container" id="app-view">
          <!-- Dynamically populated by app.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Delete Confirmation Modal Dialog -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Hapus Pengeluaran</h3>
        <p class="modal-desc">Apakah Anda yakin ingin menghapus pengeluaran ini? Tindakan ini tidak dapat dibatalkan.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="delete-cancel-btn">Batal</button>
        <button class="btn btn-primary" id="delete-confirm-btn" style="background-color: var(--primary);">Hapus</button>
      </div>
    </div>
  </div>

  <!-- CDNs for External Libraries -->
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
  <!-- Main Application Logic Script -->
  <script src="app.js"></script>
</body>
</html>
